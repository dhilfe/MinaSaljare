services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - minasaljare_postgres:/var/lib/postgresql/data
    networks:
      - minasaljare
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      WEB_THREADS: ${WEB_THREADS:-2}
      WEB_TIMEOUT: ${WEB_TIMEOUT:-60}
    depends_on:
      - db
    networks:
      - minasaljare
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - minasaljare
    restart: unless-stopped

  cloudflared:
    profiles:
      - edge
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CF_TUNNEL_TOKEN}
    depends_on:
      - nginx
    networks:
      - minasaljare
    restart: unless-stopped

  backup:
    profiles:
      - ops
    build:
      context: .
      dockerfile: ops/backup/Dockerfile
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST:-db}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      BACKUP_DIR: /backups
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE}
    volumes:
      - ./backups:/backups
    depends_on:
      - db
    networks:
      - minasaljare
    restart: unless-stopped

  monitor:
    profiles:
      - ops
    build:
      context: .
      dockerfile: ops/monitor/Dockerfile
    environment:
      MONITOR_URL: ${MONITOR_URL:-http://nginx/api/health/}
      HEALTHCHECKS_PING_URL: ${HEALTHCHECKS_PING_URL:-}
    depends_on:
      - nginx
    networks:
      - minasaljare
    restart: unless-stopped

networks:
  minasaljare:
    name: minasaljare

volumes:
  minasaljare_postgres:
    name: minasaljare_postgres
