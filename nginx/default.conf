server {
    listen 80;
    server_name _;

    # Basic protection against abuse. Adjust as needed.
    # Uses client IP seen by nginx (cloudflared preserves X-Forwarded-For).
    limit_req_zone $binary_remote_addr zone=api_ratelimit:10m rate=10r/s;

    location /api/ {
        limit_req zone=api_ratelimit burst=20 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
